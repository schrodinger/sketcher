name: Nightly Build

on:
  workflow_dispatch:
    inputs:
      branches-to-build:
        description: 'Comma-separated branches to build'
        required: false
        type: string
        default: main
      dry-run:
        description: 'Skip npm publishing'
        required: false
        type: boolean
        default: false

jobs:
  parse-inputs:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.parse.outputs.branches }}
    steps:
      - id: parse
        env:
          RELEASE_BRANCHES: ${{ inputs.branches-to-build }}
        run: |
          branches=$(echo "$RELEASE_BRANCHES" | \
            python3 -c "import sys,json; s=sys.stdin.read().strip(); \
            print(json.dumps([b.strip() for b in s.split(',') if b.strip()]))")
          echo "branches=$branches" >> $GITHUB_OUTPUT

  build-branch:
    needs: parse-inputs
    if: ${{ needs.parse-inputs.outputs.branches != '[]' }}
    strategy:
      matrix:
        branch: ${{ fromJson(needs.parse-inputs.outputs.branches) }}
    uses: ./.github/workflows/sketcher-builder.yml
    with:
      ref: ${{ matrix.branch }}
      publish-npm-package: ${{ !inputs.dry-run }}

  # Publish the main branch wasm build to GitHub Pages so the latest Sketcher
  # can be tried directly in the browser
  deploy-pages:
    needs: [parse-inputs, build-branch]
    if: ${{ contains(fromJson(needs.parse-inputs.outputs.branches), 'main') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download wasm artifact
        uses: actions/download-artifact@v7
        with:
          name: sketcher-main-wasm
          path: site

      - name: Use the wasm shell as the landing page
        run: cp site/wasm_shell.html site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
