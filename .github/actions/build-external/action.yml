name: 'build-external'
description: 'Either builds an external dependency or fetches it from cache'

inputs:
  library:
    description: 'Name of the dependency to build'
    required: true
  version:
    description: 'Version of the dependency to build'
    required: true
  host-build:
    description: 'Whether to build a host library for use in cross-compiling (e.g. a Linux build of Qt that gets used during the WASM build process)'
    default: false

outputs:
  path:
    description: 'Absolute path to the installed dependency'
    value: ${{ github.workspace }}/${{ steps.vars.outputs.lib-dir }}

runs:
  using: 'composite'
  steps:
    - name: Determine build directories and cache keys
      id: vars
      shell: bash
      run: |
        BUILD_DIR="build/external${{ inputs.host-build == 'true' && '/host' || '' }}"
        echo "build-dir=${BUILD_DIR}" >> $GITHUB_OUTPUT
        echo "lib-dir=${BUILD_DIR}/${{ inputs.library }}-${{ inputs.version }}" >> $GITHUB_OUTPUT
        echo "cache-key=${{ inputs.library }}-${{ inputs.version }}-${{ matrix.runner }}-${{ matrix.build-name }}${{ inputs.host-build == 'true' && '-host' || '' }}-${{ hashFiles('external/CMakeLists.txt', 'external/versions.json', 'external/sqlite_cmake/*', 'external/*.patch') }}" >> $GITHUB_OUTPUT
        # Only dependencies with a pinned source archive hash in versions.json
        # have their source archive cached. The cache is shared across OSes, and
        # including the hash in the key means that a hash change can never
        # restore a stale archive.
        SOURCE_ARCHIVE_SHA256="${{ fromJson(env.VERSIONS_JSON).source_archive_sha256[inputs.library] }}"
        echo "cache-source=$([ -n "${SOURCE_ARCHIVE_SHA256}" ] && echo true || echo false)" >> $GITHUB_OUTPUT
        echo "source-cache-path=${{ env.DEPENDENCY_SOURCE_CODE_CACHE_DIR }}/${{ inputs.library }}" >> $GITHUB_OUTPUT
        echo "source-cache-key=dependency-source-${{ inputs.library }}-${{ inputs.version }}-${SOURCE_ARCHIVE_SHA256}" >> $GITHUB_OUTPUT

    - name: Restore built dependency from cache
      uses: actions/cache@v5
      id: cache-check
      with:
        path: ${{ steps.vars.outputs.lib-dir }}
        # Regenerate the cache if the version OR external/CMakeLists.txt changes
        key: ${{ steps.vars.outputs.cache-key }}

    - name: Restore dependency source archive from cache
      uses: actions/cache/restore@v5
      id: source-cache-check
      if: steps.cache-check.outputs.cache-hit != 'true' && steps.vars.outputs.cache-source == 'true'
      continue-on-error: true
      with:
        path: ${{ steps.vars.outputs.source-cache-path }}
        key: ${{ steps.vars.outputs.source-cache-key }}
        enableCrossOsArchive: true

    # Download the source archive separately from the build so that it gets
    # cached as soon as possible, which lets runners that reach this point later
    # use it even if they started before it was available
    - name: Download dependency source archive
      id: download-source
      if: steps.cache-check.outputs.cache-hit != 'true' && steps.vars.outputs.cache-source == 'true' && steps.source-cache-check.outputs.cache-hit != 'true'
      shell: bash
      run: cmake --build ${{ steps.vars.outputs.build-dir }} --verbose --target ${{ inputs.library }}-download

    - name: Save dependency source archive to cache
      uses: actions/cache/save@v5
      if: steps.download-source.outcome == 'success'
      continue-on-error: true
      with:
        path: ${{ steps.vars.outputs.source-cache-path }}
        key: ${{ steps.vars.outputs.source-cache-key }}
        enableCrossOsArchive: true

    - name: Build dependency
      if: steps.cache-check.outputs.cache-hit != 'true'
      # The Windows Qt build fails if we try to use bash, since it shells out to
      # cmd and doesn't protect the path backslashes from bash
      shell: ${{ runner.os == 'windows' && 'cmd' || 'bash' }}
      env:
        use-emsdk: ${{ matrix.build-name == 'wasm' && inputs.host-build == 'false' && 'true' }}
        # cmd uses ^ for escaping newlines instead of
        endl: ${{ runner.os == 'windows' && '^' || '\' }}
      run: |
        ${{ env.use-emsdk == 'true' && 'source emsdk_env.sh && ' || '' }}${{env.endl}}
        cmake --build ${{ steps.vars.outputs.build-dir }} --verbose${{env.endl}}
              --target ${{ inputs.library }}${{env.endl}}
              --config ${{ env.BUILD_TYPE }}

    # save the dependency build even if the rest of the build fails
    - name: Save built dependency to cache
      if: steps.cache-check.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.vars.outputs.lib-dir }}
        key: ${{ steps.vars.outputs.cache-key }}
